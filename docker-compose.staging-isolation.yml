services:
  ollama:
    environment:
      OLLAMA_NOPRUNE: "true"

  # Keep the dependency name used by LiteLLM. Staging checks a preloaded model.
  ollama-pull:
    entrypoint: ["ollama", "show", "llama3.2:3b-instruct-q4_K_M"]

  litellm:
    environment:
      AISOC_LLM_MODEL_FAST: ollama_chat/llama3.2:3b-instruct-q4_K_M
      AISOC_LLM_MODEL_DEEP: ollama_chat/llama3.2:3b-instruct-q4_K_M
      AISOC_LLM_API_BASE: http://ollama:11434


  preflight-secrets:
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set a staging-only LITELLM_MASTER_KEY}
    networks:
      - default

networks:
  aisoc:
    internal: true
  default:
    internal: true
