name: Windows Security RLS isolation

on:
  pull_request:
    paths:
      - 'services/api/tests/test_windows_security_rls_integration.py'
      - '.github/workflows/windows-security-rls.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-tenant-isolation:
    name: Windows Security — real PostgreSQL tenant isolation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local_test_only
          POSTGRES_DB: aegis_rls_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aegis_rls_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_MIGRATION_URL: postgresql://postgres:local_test_only@127.0.0.1:5432/aegis_rls_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install isolated test dependencies
        run: python -m pip install 'pytest>=9.0.3,<10' 'pytest-asyncio>=1.0,<2' 'asyncpg>=0.29,<0.32'
      - name: Verify actual cross-tenant row-level security
        run: python -m pytest -q -rs services/api/tests/test_windows_security_rls_integration.py
