name: Copilot guard regression

on:
  pull_request:
    paths:
      - 'services/agents/app/api/copilot.py'
      - 'services/agents/tests/test_copilot_tool_output_guard.py'
      - 'services/agents/tests/test_supabase_session_pool_budget.py'
      - 'services/agents/app/api/conversation_store.py'
      - 'services/agents/app/hunt/store.py'
      - 'services/agents/app/investigator/ledger.py'
      - '.github/workflows/copilot-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  copilot-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install locked agents dependencies
        working-directory: services/agents
        run: |
          python -m pip install poetry
          poetry config virtualenvs.create false
          poetry install --only main --no-root --sync
          python -m pip install 'pytest>=9.0.3,<10' 'pytest-asyncio>=1,<2'
      - name: Run focused Copilot regression cases
        working-directory: services/agents
        run: python -m pytest -q tests/test_copilot_tool_output_guard.py tests/test_supabase_session_pool_budget.py
