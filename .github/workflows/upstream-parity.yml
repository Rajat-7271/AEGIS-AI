name: Upstream parity focused checks

on:
  push:
    branches: [migration/upstream-parity]
    paths:
      - "services/agents/app/tools/mitre_full.py"
      - "services/agents/tests/test_mitre_corpus_provenance.py"
      - "services/agents/app/investigator/responder_agent.py"
      - "services/agents/tests/test_responder_safe_fallback.py"
      - "services/agents/app/context/vendor_evidence.py"
      - "services/agents/app/models/state.py"
      - "services/agents/app/investigator/ledger.py"
      - "services/agents/app/workers/fused_alert_consumer.py"
      - "services/agents/app/agents/auto_triage_agent.py"
      - "services/agents/tests/test_vendor_evidence.py"
      - "services/agents/tests/test_auto_triage_ledger_records_the_prompt.py"
      - "services/agents/tests/test_ledger_tenant.py"
      - "services/agents/tests/test_response_simulation_ledger.py"
      - "services/agents/pyproject.toml"
      - "services/agents/poetry.lock"
      - ".github/workflows/upstream-parity.yml"
  pull_request:
    branches: [release/public-mvp, migration/upstream-parity]
    paths:
      - "services/agents/app/tools/mitre_full.py"
      - "services/agents/tests/test_mitre_corpus_provenance.py"
      - "services/agents/app/investigator/responder_agent.py"
      - "services/agents/tests/test_responder_safe_fallback.py"
      - "services/agents/app/context/vendor_evidence.py"
      - "services/agents/app/models/state.py"
      - "services/agents/app/investigator/ledger.py"
      - "services/agents/app/workers/fused_alert_consumer.py"
      - "services/agents/app/agents/auto_triage_agent.py"
      - "services/agents/tests/test_vendor_evidence.py"
      - "services/agents/tests/test_auto_triage_ledger_records_the_prompt.py"
      - "services/agents/tests/test_ledger_tenant.py"
      - "services/agents/tests/test_response_simulation_ledger.py"
      - "services/agents/pyproject.toml"
      - "services/agents/poetry.lock"
      - ".github/workflows/upstream-parity.yml"

permissions:
  contents: read

jobs:
  mitre-provenance:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/agents
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Install Poetry
        run: python -m pip install poetry
      - name: Install locked agent dependencies
        run: poetry install --with dev --no-root
      - name: Test MITRE corpus provenance and safe responder fallback
        run: poetry run pytest tests/test_mitre_corpus_provenance.py tests/test_responder_safe_fallback.py tests/test_vendor_evidence.py tests/test_auto_triage_ledger_records_the_prompt.py tests/test_ledger_tenant.py tests/test_response_simulation_ledger.py -q
