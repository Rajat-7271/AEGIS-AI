name: Windows security pilot tests

on:
  pull_request:
    paths:
      - 'tools/windows/**'
      - 'services/api/app/api/v1/endpoints/windows_security.py'
      - 'services/api/tests/test_windows_security_status.py'
      - '.github/workflows/windows-security-pilot.yml'
  push:
    branches:
      - feat/windows-security-continuous-pilot
      - codex/windows-security-integration
    paths:
      - 'tools/windows/**'
      - 'services/api/app/api/v1/endpoints/windows_security.py'
      - 'services/api/tests/test_windows_security_status.py'
      - '.github/workflows/windows-security-pilot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-probe:
    name: Windows probe fixtures
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: python -m pytest -q tools/windows/test_windows_probe.py tools/windows/test_windows_launcher.py tools/windows/test_collector.py

  windows-pilot:
    name: Windows pilot offline tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Compile pilot modules
        run: python -m compileall -q tools/windows
      - name: Run offline receiver and sender tests
        run: |
          python -m pytest -q -o asyncio_default_fixture_loop_scope=function \
            tools/windows/test_staging_http_adapter.py \
            tools/windows/test_staging_receiver.py \
            tools/windows/test_staging_postgres_receiver.py \
            tools/windows/test_source_epoch_contract.py \
            tools/windows/test_source_continuity.py \
            tools/windows/test_upload_security_events.py \
            tools/windows/test_upload_security_events_v2.py \
            tools/windows/test_plan_v2_migration.py \
            tools/windows/test_prepare_v2_batch.py \
            tools/windows/test_collector.py \
            tools/windows/test_upload_security_events_v2_retry.py
          python -m pytest -q tools/windows/test_staging_epoch_wsgi.py
          python -m pytest -q tools/windows/test_synthetic_detection_bridge.py

  postgres-integration:
    name: Windows pilot PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: windows_pilot_test
          POSTGRES_USER: windows_pilot_ci
          POSTGRES_PASSWORD: ci-local-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U windows_pilot_ci -d windows_pilot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_MIGRATION_URL: postgresql://windows_pilot_ci:ci-local-only-password@127.0.0.1:5432/windows_pilot_test
      AEGIS_WINDOWS_TEST_DATABASE_URL: postgresql://windows_pilot_app:ci-runtime-only-password@127.0.0.1:5432/windows_pilot_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated test dependencies
        run: python -m pip install pytest "psycopg[binary]>=3,<4"
      - name: Create restricted API runtime login
        env:
          PGPASSWORD: ci-local-only-password
        run: |
          psql -h 127.0.0.1 -U windows_pilot_ci -d windows_pilot_test -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE windows_pilot_app LOGIN PASSWORD 'ci-runtime-only-password'
            NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE NOREPLICATION;
          REVOKE CREATE ON SCHEMA public FROM PUBLIC;
          GRANT USAGE ON SCHEMA public TO windows_pilot_app;
          SQL
      - name: Run PostgreSQL integration tests
        run: python -m pytest -q tools/windows/test_staging_postgres_integration.py
      - name: Build API environment from its own lock
        run: |
          python -m venv /tmp/windows-api-test
          python scripts/service_requirements.py api --locked > /tmp/windows-api-locked.txt
          /tmp/windows-api-test/bin/python -m pip install -r /tmp/windows-api-locked.txt
      - name: Verify tenant-bound receipt API with real database authentication
        env:
          PYTHONPATH: services/api
          DATABASE_URL: postgresql://windows_pilot_app:ci-runtime-only-password@127.0.0.1:5432/windows_pilot_test
          ENVIRONMENT: test
        run: /tmp/windows-api-test/bin/python -m pytest -q services/api/tests/test_windows_security_status.py -o addopts=''
