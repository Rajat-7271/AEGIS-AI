name: Windows pilot offline identity

on:
  pull_request:
    paths:
      - "tools/windows/test_windows_identity.py"
      - "tools/windows/ship_security_events.py"
      - "tools/windows/test_ship_security_events.py"
      - "tools/windows/schedule_security_export.ps1"
      - "tools/windows/run_security_pipeline.ps1"
      - "tools/windows/export-security-events.ps1"
      - "services/connectors/app/connectors/windows_event.py"
      - "services/connectors/app/connectors/base.py"
      - "services/ingest/internal/normalizer/windows_pipeline_test.go"
      - "services/ingest/internal/normalizer/normalizer.go"
      - "apps/web/src/components/explore/ExploreView.tsx"
      - "apps/web/src/components/explore/ExploreView.test.tsx"
      - ".github/workflows/windows-pilot-identity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  identity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated connector dependencies
        run: |
          python -m pip install "httpx==0.28.1" "structlog==26.1.0"
      - name: Verify synthetic Windows source identities
        run: |
          python tools/windows/test_windows_identity.py
          python tools/windows/test_ship_security_events.py

  powershell-syntax:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Parse Windows pipeline scripts without executing or installing
        shell: powershell
        run: |
          $paths = @(
            'tools/windows/export-security-events.ps1',
            'tools/windows/run_security_pipeline.ps1',
            'tools/windows/schedule_security_export.ps1'
          )
          foreach ($path in $paths) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path).Path, [ref]$tokens, [ref]$errors
            )
            if ($errors.Count -gt 0) { throw "$path parse failed: $($errors | Out-String)" }
          }

  go-ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/ingest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/ingest/go.mod
          cache-dependency-path: services/ingest/go.sum
      - name: Verify Windows ingest normalization and replay identity
        run: go test ./internal/normalizer -run TestWindowsShipperEnvelopeNormalizesAndReplays -count=1

  web-explorer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Test Windows event lake view
        run: pnpm --dir apps/web exec vitest run src/components/explore/ExploreView.test.tsx
