name: Windows pilot offline identity

on:
  pull_request:
    paths:
      - "tools/windows/test_windows_identity.py"
      - "services/connectors/app/connectors/windows_event.py"
      - "services/connectors/app/connectors/base.py"
      - ".github/workflows/windows-pilot-identity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  identity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated connector dependencies
        run: |
          python -m pip install "httpx==0.28.1" "structlog==26.1.0"
      - name: Verify synthetic Windows source identities
        run: python tools/windows/test_windows_identity.py
