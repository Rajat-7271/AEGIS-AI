name: Incident PDF render smoke

on:
  pull_request:
    branches: [release/public-mvp]
    paths:
      - "services/agents/app/investigator/report_writer_agent.py"
      - "services/agents/tests/test_executive_summary_evidence.py"
      - "services/agents/pyproject.toml"
      - "services/agents/poetry.lock"
      - ".github/workflows/incident-pdf-render.yml"

permissions:
  contents: read

jobs:
  render-pdf:
    name: Render non-production incident PDF
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/agents
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Install Poetry
        run: python -m pip install poetry
      - name: Install locked agent dependencies
        run: poetry install --with dev --no-root
      - name: Install PDF renderer
        run: poetry run python -m pip install "weasyprint==70.0"
      - name: Assert renderer is installed
        run: poetry run python -c "import weasyprint; print(weasyprint.__version__)"
      - name: Render and validate sample incident PDF
        env:
          PYTHONPATH: .
          AEGIS_PDF_SMOKE_OUTPUT: ../../artifacts/incident-report-smoke.pdf
        run: poetry run pytest tests/test_executive_summary_evidence.py -q
      - name: Upload non-production PDF for visual review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: incident-report-pdf-smoke
          path: artifacts/incident-report-smoke.pdf
          if-no-files-found: error
          retention-days: 7
