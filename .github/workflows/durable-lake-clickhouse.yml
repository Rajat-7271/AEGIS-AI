name: Durable lake ClickHouse integration

on:
  pull_request:
    paths:
      - 'services/fusion/**'
      - 'services/api/clickhouse/**'
      - '.github/workflows/durable-lake-clickhouse.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clickhouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install 'pytest>=9.0.3,<10' 'pytest-asyncio>=1,<2' 'clickhouse-driver>=0.2.6,<0.3' 'structlog>=24,<25' 'aiokafka>=0.10,<0.11' 'pytest-timeout>=2.3,<3'
      - name: Start isolated ClickHouse
        run: |
          set -euo pipefail
          docker run -d --name aegis-lake-ci -p 127.0.0.1:19000:9000 clickhouse/clickhouse-server:23.8
          for attempt in $(seq 1 60); do
            if docker exec aegis-lake-ci clickhouse-client --query 'SELECT 1' >/dev/null 2>&1; then
              echo "ClickHouse ready"
              exit 0
            fi
            sleep 2
          done
          echo "ClickHouse failed to become ready"
          exit 1
      - name: Start isolated Kafka-compatible broker
        run: |
          set -euo pipefail
          docker run -d --name aegis-lake-kafka-ci \
            -p 127.0.0.1:19092:19092 \
            docker.redpanda.com/redpandadata/redpanda:v24.2.8 \
            redpanda start --overprovisioned --smp 1 --memory 1G \
            --reserve-memory 0M --check=false \
            --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092 \
            --advertise-kafka-addr internal://localhost:9092,external://localhost:19092
          for attempt in $(seq 1 60); do
            if docker exec aegis-lake-kafka-ci rpk cluster info >/dev/null 2>&1; then
              echo "Kafka-compatible broker ready"
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Initialize actual lake schema
        run: |
          set -euo pipefail
          docker exec -i aegis-lake-ci clickhouse-client --multiquery < services/api/clickhouse/001_init.sql
          test "$(docker exec aegis-lake-ci clickhouse-client --query 'EXISTS TABLE aisoc.raw_events')" = 1
      - name: Run durable lake integration and unit tests
        working-directory: services/fusion
        run: |
          set -euo pipefail
          python -m pytest -q -o asyncio_default_fixture_loop_scope=function tests/test_durable_lake_clickhouse_ci.py tests/test_durable_lake_sink.py tests/test_lake_offsets.py tests/test_durable_lake_processor.py tests/test_lake_clickhouse_integration.py tests/test_lake_kafka_integration.py tests/test_lake_rebalance.py tests/test_lake_rebalance_concurrency.py tests/test_durable_lake_worker.py tests/test_lake_end_to_end_ci.py tests/test_durable_lake_invalid_events.py
      - name: Collect ClickHouse diagnostics on failure
        if: failure()
        run: |
          docker ps -a --filter name=aegis-lake-ci || true
          docker logs --tail 150 aegis-lake-kafka-ci || true
          docker logs --tail 150 aegis-lake-ci || true
          docker exec aegis-lake-ci tail -n 100 /var/log/clickhouse-server/clickhouse-server.err.log || true
      - name: Clean up isolated test container
        if: always()
        run: |
          docker rm -f aegis-lake-ci || true
          docker rm -f aegis-lake-kafka-ci || true
