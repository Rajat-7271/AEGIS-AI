<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>AEGIS AI Mark</title>
  <defs>
    <linearGradient id="aegisMarkOutline" x1="32" y1="4" x2="32" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="aegisMarkInner" x1="32" y1="8" x2="32" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="aegisMarkBody" x1="32" y1="14" x2="32" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="aegisMarkCore" x1="32" y1="20" x2="32" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <!-- Outer shield -->
  <path d="M32 4 L54 14 V34 C54 47.5 43.5 57 32 60 C20.5 57 10 47.5 10 34 V14 Z"
        fill="url(#aegisMarkInner)"
        stroke="url(#aegisMarkOutline)"
        stroke-width="2.75"
        stroke-linejoin="round"/>
  <!-- Inner guard contour -->
  <path d="M32 9 L49 17 V33 C49 43.5 40.5 51.5 32 54.5 C23.5 51.5 15 43.5 15 33 V17 Z"
        stroke="#60a5fa"
        stroke-width="1"
        stroke-opacity="0.3"
        stroke-linejoin="round"/>
  <!-- Upward-facing A -->
  <path d="M21 44 L32 17 L43 44 M25.5 35.5 H38.5"
        stroke="url(#aegisMarkBody)"
        stroke-width="3.5"
        stroke-linecap="round"
        stroke-linejoin="round"/>
  <circle cx="32" cy="17" r="2.2" fill="#38bdf8"/>
  <path d="M28 35.5 L32 26 L36 35.5"
        stroke="url(#aegisCoreGrad)"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"/>
</svg>
